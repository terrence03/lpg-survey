# 複製成 config/credentials.toml 後填入實際值（config/ 已被 .gitignore 排除，不會進 Git）。
# 格式與原 Streamlit 版的 .streamlit/secrets.toml 相同，舊檔可直接改名使用。

[spreadsheet]
check_in = "打卡試算表的 ID（網址 /d/ 和 /edit 中間那段）"
response = "問卷試算表的 ID"

# 從 Google Cloud 下載的服務帳戶金鑰 JSON，逐項填入。
# 兩張試算表都要分享給 client_email，權限為「編輯者」。
[gcp_service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = ""
client_id = ""
token_uri = "https://oauth2.googleapis.com/token"
